services:
  haluan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haluan
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/haluan.db
